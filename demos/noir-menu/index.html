<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casa Brasa · Menú digital — Demo Noir Menu</title>
  <meta name="description" content="Demo de Noir Menu: menú digital con código QR y pedidos directo a WhatsApp, creado por Noir Studio.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0C0B0A">
  <link rel="icon" href="../../favicon.ico" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0C0B0A; --surface: #161412; --surface-2: #1E1B18; --border: #2A2622;
      --text: #F3EEE8; --muted: #A39B92; --accent: #E9B872; --accent-ink: #1A1206; --ok: #25D366;
      --r: 18px; --ease: cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px; }
    body { background: #070606; color: var(--text); font-family: Manrope, system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    img { display: block; max-width: 100%; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

    .demo-bar { padding: 9px 16px; background: #000; border-bottom: 1px solid #1d1d22; font-size: .78rem; color: #b7b9c1; text-align: center; }
    .demo-bar a { color: #fff; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

    .app { max-width: 540px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 120px; box-shadow: 0 0 0 1px #15130f; }

    /* Portada */
    .cover { position: relative; height: 210px; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.55) saturate(1.1); }
    .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, var(--bg)); }
    .table-tag { position: absolute; top: 14px; right: 14px; z-index: 1; padding: 6px 12px; border-radius: 999px; background: rgba(12,11,10,.75); backdrop-filter: blur(8px); font-size: .8rem; font-weight: 700; border: 1px solid rgba(255,255,255,.12); }
    .head { position: relative; margin-top: -64px; padding: 0 18px; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: Fraunces, serif; font-size: 1.7rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    h1 { font-family: Fraunces, serif; font-weight: 600; font-size: 1.85rem; line-height: 1.1; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: .82rem; color: var(--muted); }
    .meta b { color: var(--ok); font-weight: 700; }

    .search { position: relative; margin: 18px 18px 0; }
    .search input { width: 100%; height: 48px; padding: 0 16px 0 44px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 1rem; }
    .search input::placeholder { color: #7d756d; }
    .search svg { position: absolute; left: 15px; top: 14px; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; }

    .chips { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto; padding: 14px 18px; margin-top: 6px; background: rgba(12,11,10,.92); backdrop-filter: blur(10px); scrollbar-width: none; border-bottom: 1px solid var(--border); }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; text-decoration: none; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: .88rem; font-weight: 600; color: var(--muted); transition: .25s; }
    .chip.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    section { padding: 22px 18px 4px; }
    h2 { font-family: Fraunces, serif; font-weight: 600; font-size: 1.35rem; margin-bottom: 12px; }
    .items { display: grid; gap: 12px; }
    .item { display: grid; grid-template-columns: 1fr 104px; gap: 14px; padding: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); text-align: left; width: 100%; transition: transform .3s var(--ease), border-color .3s; }
    .item:hover { border-color: #3a342e; transform: translateY(-2px); }
    .item h3 { font-size: 1rem; font-weight: 700; }
    .item p { margin-top: 4px; font-size: .84rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .price { margin-top: 10px; font-weight: 800; }
    .badge { display: inline-block; margin-bottom: 6px; padding: 2px 8px; border-radius: 6px; font-size: .68rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: rgba(233,184,114,.14); color: var(--accent); }
    .thumb { position: relative; width: 104px; height: 104px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
    .add { position: absolute; right: -6px; bottom: -6px; width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 1.4rem; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,.5); transition: transform .2s; }
    .add:active { transform: scale(.9); }
    .qty-pill { position: absolute; left: 6px; top: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .78rem; font-weight: 800; display: grid; place-items: center; }
    .empty { padding: 40px 18px; text-align: center; color: var(--muted); }

    /* Barra de pedido */
    .cartbar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 20; width: min(508px, calc(100% - 28px)); transform: translate(-50%, 140%); transition: transform .45s var(--ease); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); font-weight: 800; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
    .cartbar.is-on { transform: translate(-50%, 0); }
    .cartbar .count { display: inline-grid; place-items: center; min-width: 28px; height: 28px; margin-right: 10px; border-radius: 9px; background: rgba(0,0,0,.14); }

    /* Hojas (detalle y carrito) */
    .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); opacity: 0; visibility: hidden; transition: .3s; }
    .scrim.is-on { opacity: 1; visibility: visible; }
    .sheet { position: fixed; left: 50%; bottom: 0; z-index: 31; width: min(540px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; background: var(--surface); border: 1px solid var(--border); transform: translate(-50%, 105%); transition: transform .45s var(--ease); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    .sheet.is-on { transform: translate(-50%, 0); }
    .sheet__grab { width: 44px; height: 5px; border-radius: 9px; background: #3a342e; margin: 10px auto 0; }
    .sheet__close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; background: rgba(12,11,10,.7); font-size: 1.2rem; }
    .detail img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .pad { padding: 18px; }
    .detail h3 { font-family: Fraunces, serif; font-size: 1.5rem; font-weight: 600; }
    .detail p { margin-top: 6px; color: var(--muted); }
    label.small { display: block; margin: 16px 0 6px; font-size: .82rem; font-weight: 700; color: var(--muted); }
    .field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 1rem; }
    textarea.field { resize: vertical; min-height: 70px; }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .stepper button { width: 42px; height: 46px; font-size: 1.2rem; font-weight: 700; }
    .stepper span { min-width: 30px; text-align: center; font-weight: 800; }
    .btn { flex: 1; height: 50px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 1rem; }
    .btn--wa { background: var(--ok); color: #04210f; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 18px; }

    .cart h3 { font-family: Fraunces, serif; font-size: 1.4rem; font-weight: 600; }
    .line { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .line img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; }
    .line b { display: block; font-size: .95rem; }
    .line small { color: var(--muted); font-size: .8rem; }
    .line .stepper button { width: 34px; height: 36px; font-size: 1rem; }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 14px; background: var(--bg); border: 1px solid var(--border); }
    .seg button { padding: 10px 6px; border-radius: 10px; font-weight: 700; font-size: .88rem; color: var(--muted); }
    .seg button.is-on { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px #3a342e; }
    .totals { margin-top: 16px; display: grid; gap: 6px; font-size: .92rem; color: var(--muted); }
    .totals div { display: flex; justify-content: space-between; }
    .totals .grand { color: var(--text); font-weight: 800; font-size: 1.1rem; padding-top: 8px; border-top: 1px dashed var(--border); }
    .err { color: #ff9a8a; font-size: .82rem; margin-top: 6px; min-height: 1em; }
    .note { margin-top: 12px; font-size: .78rem; color: var(--muted); text-align: center; }

    .toast { position: fixed; left: 50%; top: 16px; z-index: 40; transform: translate(-50%, -150%); padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 700; font-size: .9rem; transition: transform .4s var(--ease); }
    .toast.is-on { transform: translate(-50%, 0); }

    footer { padding: 30px 18px; text-align: center; font-size: .8rem; color: var(--muted); }
    footer a { color: var(--text); font-weight: 700; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="demo-bar">✦ Demo de <strong>Noir Menu</strong> por Noir Studio · <a href="../../#contacto">Quiero uno así</a></div>

  <div class="app">
    <div class="cover">
      <img src="img/lomo-papas.webp" alt="" width="480" height="480">
      <span class="table-tag" id="table-tag" hidden></span>
    </div>
    <header class="head">
      <div class="brand">
        <div class="logo" aria-hidden="true">B</div>
        <div><h1>Casa Brasa</h1><div style="color:var(--muted);font-size:.9rem">Parrilla · Hamburguesas · Bowls</div></div>
      </div>
      <div class="meta"><span><b>● Abierto</b> · cierra 10:00 p. m.</span><span>🛵 Domicilio 30–40 min</span><span>📍 Bogotá</span></div>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar en el menú" aria-label="Buscar en el menú">
    </div>

    <nav class="chips" id="chips" aria-label="Categorías"></nav>
    <main id="menu"></main>
    <p class="empty" id="empty" hidden>No encontramos platos con esa búsqueda.</p>

    <footer>Menú digital hecho por <a href="../../">Noir Studio ✦</a></footer>
  </div>

  <button class="cartbar" id="cartbar" type="button" aria-label="Ver pedido">
    <span><span class="count" id="cart-count">0</span>Ver pedido</span><span id="cart-total">$0</span>
  </button>

  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-name"></div>
  <div class="sheet" id="cart" role="dialog" aria-modal="true" aria-labelledby="c-title"></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    // Número que recibe los pedidos (código de país + número)
    const WHATSAPP_NUMBER = '573135639329';

    const MENU = [
      { cat: 'Hamburguesas', items: [
        { id: 'b1', name: 'Burger Noir', desc: 'Doble carne angus, cheddar añejo, cebolla caramelizada y salsa de la casa.', price: 28000, img: 'burger-noir', badge: 'Más pedido' },
        { id: 'b2', name: 'Smash con papas', desc: 'Carne smash crocante, queso americano, pepinillos y papas rústicas.', price: 26000, img: 'smash-papas' },
        { id: 'b3', name: 'Doble Bacon', desc: 'Dos carnes, tocineta ahumada, cheddar y BBQ de panela.', price: 32000, img: 'doble-bacon', badge: 'Nuevo' },
      ]},
      { cat: 'Platos fuertes', items: [
        { id: 'f1', name: 'Lomo a la brasa', desc: 'Lomo fino 300 g con papas a la francesa y chimichurri.', price: 46000, img: 'lomo-papas', badge: 'Recomendado' },
        { id: 'f2', name: 'Penne arrabbiata', desc: 'Pasta corta en salsa de tomate picante, albahaca y parmesano.', price: 29000, img: 'penne', badge: 'Picante' },
        { id: 'f3', name: 'Arroz con camarones', desc: 'Arroz cremoso, camarones salteados, cilantro y limón.', price: 38000, img: 'arroz-camarones' },
        { id: 'f4', name: 'Pizza de la casa', desc: 'Masa madre, pepperoni, cebolla morada y albahaca fresca.', price: 34000, img: 'pizza' },
        { id: 'f5', name: 'Ensalada de lomo', desc: 'Lomo en tiras, hojas verdes, marañón y vinagreta de ají.', price: 31000, img: 'ensalada-lomo' },
      ]},
      { cat: 'Bowls', items: [
        { id: 'w1', name: 'Bowl de pollo', desc: 'Pollo a la plancha, maíz, aguacate, repollo morado y arroz.', price: 27000, img: 'bowl-pollo' },
        { id: 'w2', name: 'Bowl veggie', desc: 'Garbanzos, aguacate, tomate cherry, batata asada y hummus.', price: 24000, img: 'bowl-veggie', badge: 'Veggie' },
        { id: 'w3', name: 'Ensalada verde', desc: 'Mix de hojas, zanahoria, cebolla encurtida y queso feta.', price: 19000, img: 'ensalada-verde', badge: 'Veggie' },
      ]},
      { cat: 'Postres', items: [
        { id: 'p1', name: 'Brownie Noir', desc: 'Chocolate 70 % tibio con salsa de chocolate.', price: 14000, img: 'brownie' },
        { id: 'p2', name: 'Torta de chocolate', desc: 'Tres capas de bizcocho húmedo y ganache.', price: 15000, img: 'torta' },
        { id: 'p3', name: 'Malteada Oreo', desc: 'Helado de vainilla, galleta Oreo y crema batida.', price: 16000, img: 'malteada', badge: 'Más pedido' },
        { id: 'p4', name: 'Pancakes', desc: 'Torre de pancakes con miel de maple y fruta.', price: 18000, img: 'pancakes' },
      ]},
      { cat: 'Bebidas', items: [
        { id: 'd1', name: 'Limonada de hierbabuena', desc: 'Natural, 16 oz.', price: 9000, img: 'mojito' },
        { id: 'd2', name: 'Cócteles de la casa', desc: 'Pregunta por el cóctel del día.', price: 22000, img: 'cocteles' },
        { id: 'd3', name: 'Café frío', desc: 'Cold brew con leche y un toque de vainilla.', price: 10000, img: 'cafe-frio' },
      ]},
    ];
    const DELIVERY_FEE = 5000;

    const $ = (s) => document.querySelector(s);
    const money = (n) => '$' + n.toLocaleString('es-CO');
    const slug = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-');
    const byId = Object.fromEntries(MENU.flatMap((c) => c.items).map((i) => [i.id, i]));
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const mesa = new URLSearchParams(location.search).get('mesa');
    if (mesa) { const t = $('#table-tag'); t.textContent = 'Mesa ' + mesa; t.hidden = false; }

    let cart = {};
    try { cart = JSON.parse(localStorage.getItem('casa-brasa-cart')) || {}; } catch { cart = {}; }
    let order = { type: mesa ? 'Mesa' : 'Domicilio', pay: 'Efectivo', name: '', address: '', notes: '' };
    const save = () => { try { localStorage.setItem('casa-brasa-cart', JSON.stringify(cart)); } catch {} };

    /* ---- Menú ---- */
    const renderMenu = (q = '') => {
      const term = slug(q.trim());
      let any = false;
      $('#menu').innerHTML = MENU.map((c) => {
        const items = c.items.filter((i) => !term || slug(i.name + ' ' + i.desc).includes(term));
        if (!items.length) return '';
        any = true;
        return `<section id="${slug(c.cat)}" aria-labelledby="h-${slug(c.cat)}"><h2 id="h-${slug(c.cat)}">${c.cat}</h2><div class="items">${items.map((i) => `
          <div class="item" role="button" tabindex="0" data-open="${i.id}" aria-label="${esc(i.name)}, ${money(i.price)}">
            <div>${i.badge ? `<span class="badge">${i.badge}</span>` : ''}<h3>${i.name}</h3><p>${i.desc}</p><div class="price">${money(i.price)}</div></div>
            <div class="thumb"><img src="img/${i.img}.webp" alt="" width="104" height="104" loading="lazy">
              ${cart[i.id] ? `<span class="qty-pill">${cart[i.id].qty}</span>` : ''}
              <button class="add" type="button" data-add="${i.id}" aria-label="Agregar ${esc(i.name)}">+</button></div>
          </div>`).join('')}</div></section>`;
      }).join('');
      $('#empty').hidden = any;
      $('#chips').innerHTML = MENU.filter((c) => document.getElementById(slug(c.cat)))
        .map((c) => `<a class="chip" href="#${slug(c.cat)}">${c.cat}</a>`).join('');
      spy();
    };

    let observer;
    const spy = () => {
      if (observer) observer.disconnect();
      if (!('IntersectionObserver' in window)) return;
      observer = new IntersectionObserver((es) => es.forEach((e) => {
        if (!e.isIntersecting) return;
        document.querySelectorAll('.chip').forEach((ch) => {
          const on = ch.getAttribute('href') === '#' + e.target.id;
          ch.classList.toggle('is-on', on);
          if (on) ch.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        });
      }), { rootMargin: '-140px 0px -60% 0px' });
      document.querySelectorAll('#menu section').forEach((s) => observer.observe(s));
    };

    /* ---- Carrito ---- */
    const count = () => Object.values(cart).reduce((a, l) => a + l.qty, 0);
    const subtotal = () => Object.entries(cart).reduce((a, [id, l]) => a + byId[id].price * l.qty, 0);
    const add = (id, qty = 1, note = '') => {
      const l = cart[id] || { qty: 0, note: '' };
      l.qty += qty; if (note) l.note = note;
      if (l.qty <= 0) delete cart[id]; else cart[id] = l;
      save(); refresh();
    };
    const refresh = () => {
      const n = count();
      $('#cartbar').classList.toggle('is-on', n > 0);
      $('#cart-count').textContent = n;
      $('#cart-total').textContent = money(subtotal());
      renderMenu($('#q').value);
      if ($('#cart').classList.contains('is-on')) renderCart();
    };

    const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('is-on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('is-on'), 1600); };

    /* ---- Hojas ---- */
    let lastFocus;
    const openSheet = (el) => { lastFocus = document.activeElement; $('#scrim').classList.add('is-on'); el.classList.add('is-on'); document.body.style.overflow = 'hidden'; setTimeout(() => (el.querySelector('[data-close]') || el).focus(), 50); };
    const closeSheets = () => { document.querySelectorAll('.sheet.is-on').forEach((s) => s.classList.remove('is-on')); $('#scrim').classList.remove('is-on'); document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); };

    const openDetail = (id) => {
      const i = byId[id]; let qty = 1;
      const el = $('#detail');
      el.innerHTML = `<button class="sheet__close" data-close aria-label="Cerrar">✕</button>
        <div class="detail"><img src="img/${i.img}.webp" alt="${esc(i.name)}" width="480" height="360">
        <div class="pad">${i.badge ? `<span class="badge">${i.badge}</span>` : ''}<h3 id="d-name">${i.name}</h3><p>${i.desc}</p>
        <label class="small" for="d-note">¿Alguna indicación?</label>
        <textarea class="field" id="d-note" placeholder="Ej: sin cebolla, término medio…">${cart[id] ? esc(cart[id].note || '') : ''}</textarea>
        <div class="row"><div class="stepper"><button type="button" data-q="-1" aria-label="Menos">−</button><span id="d-qty">1</span><button type="button" data-q="1" aria-label="Más">+</button></div>
        <button class="btn" id="d-add" type="button">Agregar ${money(i.price)}</button></div></div></div>`;
      el.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => { qty = Math.max(1, qty + +b.dataset.q); $('#d-qty').textContent = qty; $('#d-add').textContent = 'Agregar ' + money(i.price * qty); });
      $('#d-add').onclick = () => { add(id, qty, $('#d-note').value.trim()); closeSheets(); toast('✓ ' + i.name + ' agregado'); };
      openSheet(el);
    };

    const renderCart = () => {
      const el = $('#cart');
      const lines = Object.entries(cart);
      const fee = order.type === 'Domicilio' ? DELIVERY_FEE : 0;
      el.innerHTML = `<div class="sheet__grab"></div><button class="sheet__close" data-close aria-label="Cerrar">✕</button>
        <div class="pad cart"><h3 id="c-title">Tu pedido</h3>
        ${lines.length ? lines.map(([id, l]) => `<div class="line"><img src="img/${byId[id].img}.webp" alt="" width="56" height="56">
          <div><b>${byId[id].name}</b><small>${money(byId[id].price)}${l.note ? ' · ' + esc(l.note) : ''}</small></div>
          <div class="stepper"><button type="button" data-l="${id}" data-d="-1" aria-label="Quitar uno">−</button><span>${l.qty}</span><button type="button" data-l="${id}" data-d="1" aria-label="Agregar uno">+</button></div></div>`).join('')
          : '<p class="empty">Tu pedido está vacío.</p>'}
        <label class="small">¿Cómo lo quieres?</label>
        <div class="seg" role="radiogroup" aria-label="Tipo de pedido">${['Mesa', 'Domicilio', 'Recoger'].map((t) => `<button type="button" role="radio" aria-checked="${order.type === t}" class="${order.type === t ? 'is-on' : ''}" data-type="${t}">${t === 'Mesa' ? '🍽️' : t === 'Domicilio' ? '🛵' : '🛍️'} ${t}</button>`).join('')}</div>
        <label class="small" for="o-name">Tu nombre</label><input class="field" id="o-name" autocomplete="name" value="${esc(order.name)}" placeholder="Nombre">
        ${order.type === 'Mesa' ? `<label class="small" for="o-table">Número de mesa</label><input class="field" id="o-table" inputmode="numeric" value="${esc(mesa || order.table || '')}" placeholder="Ej: 4">` : ''}
        ${order.type === 'Domicilio' ? `<label class="small" for="o-address">Dirección de entrega</label><input class="field" id="o-address" autocomplete="street-address" value="${esc(order.address)}" placeholder="Calle, número, barrio">` : ''}
        <label class="small" for="o-pay">Forma de pago</label>
        <select class="field" id="o-pay">${['Efectivo', 'Transferencia / Nequi', 'Datáfono'].map((p) => `<option ${order.pay === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
        <div class="totals"><div><span>Subtotal</span><span>${money(subtotal())}</span></div>
          ${fee ? `<div><span>Domicilio</span><span>${money(fee)}</span></div>` : ''}
          <div class="grand"><span>Total</span><span>${money(subtotal() + fee)}</span></div></div>
        <p class="err" id="o-err" role="alert"></p>
        <button class="btn btn--wa" id="send" type="button" ${lines.length ? '' : 'disabled'}>
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm5.5-5.8c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1l-.9 1.2c-.2.2-.3.2-.6.1-1.6-.8-2.7-1.5-3.8-3.4-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.6.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3Z"/></svg>
          Enviar pedido por WhatsApp</button>
        <p class="note">El restaurante recibe tu pedido al instante y te confirma por WhatsApp.</p></div>`;
      const keep = () => { order.name = $('#o-name').value; if ($('#o-address')) order.address = $('#o-address').value; if ($('#o-table')) order.table = $('#o-table').value; order.pay = $('#o-pay').value; };
      el.querySelectorAll('[data-l]').forEach((b) => b.onclick = () => { keep(); add(b.dataset.l, +b.dataset.d); });
      el.querySelectorAll('[data-type]').forEach((b) => b.onclick = () => { keep(); order.type = b.dataset.type; renderCart(); });
      $('#send').onclick = () => {
        keep();
        const err = $('#o-err');
        if (!order.name.trim()) { err.textContent = 'Escribe tu nombre.'; $('#o-name').focus(); return; }
        if (order.type === 'Domicilio' && !order.address.trim()) { err.textContent = 'Escribe la dirección de entrega.'; $('#o-address').focus(); return; }
        if (order.type === 'Mesa' && !(order.table || '').trim()) { err.textContent = 'Escribe el número de mesa.'; $('#o-table').focus(); return; }
        const msg = [
          '🔥 *Nuevo pedido — Casa Brasa*', '',
          ...lines.map(([id, l]) => `• ${l.qty}× ${byId[id].name} — ${money(byId[id].price * l.qty)}${l.note ? `\n   _${l.note}_` : ''}`), '',
          `🧾 Subtotal: ${money(subtotal())}`, ...(fee ? [`🛵 Domicilio: ${money(fee)}`] : []), `💰 *Total: ${money(subtotal() + fee)}*`, '',
          `👤 ${order.name.trim()}`,
          order.type === 'Mesa' ? `🍽️ Mesa ${order.table}` : order.type === 'Domicilio' ? `🛵 Domicilio: ${order.address.trim()}` : '🛍️ Para recoger',
          `💳 Pago: ${order.pay}`, '', '_Pedido de prueba enviado desde la demo de Noir Menu ✦_',
        ].join('\n');
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
      };
    };

    /* ---- Eventos ---- */
    document.addEventListener('click', (e) => {
      const a = e.target.closest('[data-add]');
      if (a) { e.stopPropagation(); add(a.dataset.add); toast('✓ ' + byId[a.dataset.add].name + ' agregado'); return; }
      const o = e.target.closest('[data-open]');
      if (o) return openDetail(o.dataset.open);
      if (e.target.closest('[data-close]') || e.target.id === 'scrim') closeSheets();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSheets();
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) { e.preventDefault(); openDetail(e.target.dataset.open); }
    });
    $('#cartbar').onclick = () => { renderCart(); openSheet($('#cart')); };
    $('#q').addEventListener('input', (e) => renderMenu(e.target.value));

    refresh();
  </script>
</body>
</html>
